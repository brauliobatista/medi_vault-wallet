name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: {}

permissions:
  contents: read
  checks: write

jobs:
  backend-unit:
    name: Backend / Unit tests (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore MediVault.Api/MediVault.Api.sln

      - name: Build
        run: dotnet build MediVault.Api/MediVault.Api.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test MediVault.Api/MediVault.Api.sln --configuration Release --no-build
          --filter "FullyQualifiedName!~MediVault.Api.Tests.Api"
          --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Publish backend unit test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Backend Unit Test Results
          path: backend/TestResults/*.trx
          reporter: dotnet-trx

  backend-api:
    name: Backend / API tests (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore MediVault.Api/MediVault.Api.sln

      - name: Build
        run: dotnet build MediVault.Api/MediVault.Api.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test MediVault.Api/MediVault.Api.sln --configuration Release --no-build
          --filter "FullyQualifiedName~MediVault.Api.Tests.Api"
          --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Publish backend API test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Backend API Test Results
          path: backend/TestResults/*.trx
          reporter: dotnet-trx

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/medivault-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/medivault-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run --reporter=default --reporter=junit --outputFile=./test-results/junit.xml

      - name: Publish frontend test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Frontend Test Results
          path: frontend/medivault-web/test-results/junit.xml
          reporter: java-junit

      - name: Build
        run: npm run build

  database:
    name: Database (SQLite schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply schema to a fresh SQLite database
        run: sqlite3 medivault_ci.db < database/schema_sqlite.sql

      - name: Apply seed data
        run: sqlite3 medivault_ci.db < database/seed.sql

      - name: Sanity check tables were created
        run: sqlite3 medivault_ci.db ".tables"
